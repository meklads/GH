name = "gh-form-proxy"
main = "gh-form-proxy.js"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "3dgraphicshouse.com/api/form", zone_name = "3dgraphicshouse.com" },
  { pattern = "www.3dgraphicshouse.com/api/form", zone_name = "3dgraphicshouse.com" },
  { pattern = "3dgraphicshouse.com/api/subscribe", zone_name = "3dgraphicshouse.com" },
  { pattern = "www.3dgraphicshouse.com/api/subscribe", zone_name = "3dgraphicshouse.com" },
  { pattern = "3dgraphicshouse.com/api/chat", zone_name = "3dgraphicshouse.com" },
  { pattern = "www.3dgraphicshouse.com/api/chat", zone_name = "3dgraphicshouse.com" },
]

# Optional: create KV namespace in Cloudflare dashboard, then uncomment:
# [[kv_namespaces]]
# binding = "SUBSCRIBERS"
# id = "YOUR_KV_NAMESPACE_ID"
