<!-- GH CHAT START -->
<div id="ghChatPanel" class="gh-chat-panel" dir="ltr" role="dialog" aria-modal="true" aria-labelledby="ghChatTitle" aria-hidden="true">
  <div id="ghChatHead" class="gh-chat-head">
    <img src="{{PREFIX}}assets/chatbot-motif.png" alt="" width="22" height="22" class="gh-chat-head-icon">
    <span id="ghChatTitle">GH Assistant</span>
    <span class="gh-chat-head-spacer" aria-hidden="true"></span>
    <button type="button" class="gh-chat-close" data-gh-chat-close aria-label="Close">
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </div>
  <div id="ghChatMsgs" class="gh-chat-msgs" aria-live="polite"></div>
  <div id="ghChatQuick" class="gh-chat-quick"></div>
  <div id="ghChatInput" class="gh-chat-input">
    <label class="gh-sr-only" for="ghChatField">Type your question</label>
    <input type="text" id="ghChatField" placeholder="Type your question..." autocomplete="off">
    <button type="button" id="ghChatSend" aria-label="Send">
      <span class="material-symbols-outlined" aria-hidden="true">send</span>
    </button>
  </div>
</div>
<!-- GH CHAT END -->
