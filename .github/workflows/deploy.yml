name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'meklads/GH'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::notice::COOLIFY_DEPLOY_WEBHOOK secret not set — skip auto-deploy."
            echo "Redeploy manually in Coolify after push to main."
            exit 0
          fi
          curl -fsS -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.sha }}\",\"repository\":\"${{ github.repository }}\"}"
          echo "Coolify deploy webhook triggered."

      - name: Purge Cloudflare cache (optional)
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::notice::Cloudflare purge secrets not set — purge manually if needed."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cloudflare cache purged."

      - name: Verify live deploy (optional)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::notice::Skipping live verify — no auto-deploy configured."
            exit 0
          fi
          echo "Waiting 60s for Coolify deploy…"
          sleep 60
          node scripts/verify-live-deploy.mjs
