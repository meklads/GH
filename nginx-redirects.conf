# WordPress → static site redirects (301). Loaded before location /.

# Sitemaps & language
location = /sitemap_index.xml { return 301 /sitemap.xml; }
location = /en/ { return 301 /; }

# Renamed / removed WordPress pages
location = /clients { return 301 /who-we-are.html; }
location = /clients/ { return 301 /who-we-are.html; }
location = /contact-us-2 { return 301 /contact-us.html; }
location = /contact-us-2/ { return 301 /contact-us.html; }
location = /about { return 301 /about.html; }
location = /about/ { return 301 /about.html; }
location = /about-us { return 301 /about.html; }
location = /about-us/ { return 301 /about.html; }
location = /booking { return 301 /contact-us.html; }
location = /booking/ { return 301 /contact-us.html; }

# Services (old slugs)
location = /scale-models { return 301 /services/scale-models.html; }
location = /scale-models/ { return 301 /services/scale-models.html; }
location = /interactive-presentation { return 301 /interactive-experiences.html; }
location = /interactive-presentation/ { return 301 /interactive-experiences.html; }
location = /motion-graphic { return 301 /3d-animation.html; }
location = /motion-graphic/ { return 301 /3d-animation.html; }
location = /design-development { return 301 /services/web-solutions.html; }
location = /design-development/ { return 301 /services/web-solutions.html; }
location = /services { return 301 /services/maquettes.html; }
location = /services/ { return 301 /services/maquettes.html; }

# Solution packs (old top-level URLs)
location = /growth-launch { return 301 /solutions/growth-launch.html; }
location = /growth-launch/ { return 301 /solutions/growth-launch.html; }
location = /project-launch { return 301 /solutions/project-launch.html; }
location = /project-launch/ { return 301 /solutions/project-launch.html; }
location = /brand-scale { return 301 /solutions/brand-scale.html; }
location = /brand-scale/ { return 301 /solutions/brand-scale.html; }

# Blog & taxonomy → Knowledge Hub
location = /blog { return 301 /insights/index.html; }
location = /blog/ { return 301 /insights/index.html; }
location ^~ /blog/ { return 301 /insights/index.html; }
location = /news { return 301 /insights/index.html; }
location = /news/ { return 301 /insights/index.html; }
location ^~ /category/ { return 301 /insights/index.html; }
location ^~ /tag/ { return 301 /insights/index.html; }
location ^~ /author/ { return 301 /insights/index.html; }
location = /feed { return 301 /insights/index.html; }
location = /feed/ { return 301 /insights/index.html; }
location ^~ /comments/ { return 410; }

# WordPress infrastructure (gone)
location ^~ /wp-admin { return 410; }
location ^~ /wp-json { return 410; }
location = /xmlrpc.php { return 410; }
location ^~ /wp-includes { return 410; }
location ^~ /wp-content/plugins { return 410; }
location ^~ /wp-content/themes { return 410; }
