server {
    listen 80 default_server;
    server_name 3dgraphicshouse.com www.3dgraphicshouse.com _;
    root /usr/share/nginx/html;
    index index.html index-ar.html;

    include /etc/nginx/conf.d/redirects.conf;

    location / {
        # WordPress used trailing slashes; strip when not a real directory.
        if (!-d $request_filename) {
            rewrite ^/(.+?)/$ /$1 permanent;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
