server {
    listen 80 default_server;
    server_name www.beestoon.com beestoon.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare domain → www (works even when proxied through Coolify)
    if ($http_host = "beestoon.com") {
        return 301 https://www.beestoon.com$request_uri;
    }

    # Redirect /index.html → clean root URL
    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
