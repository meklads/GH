# Force a single host: apex (non-www). Google was indexing www as canonical.
server {
    listen 80;
    server_name www.3dgraphicshouse.com;
    return 301 https://3dgraphicshouse.com$request_uri;
}

server {
    listen 80 default_server;
    server_name 3dgraphicshouse.com _;
    root /usr/share/nginx/html;
    index index.html index-ar.html;

    include /etc/nginx/snippets/gh-redirects.conf;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # PDFs: enable range requests + cache; prefer download for reliability on large files
    location ~* \.pdf$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Disposition "inline";
        types { application/pdf pdf; }
        default_type application/pdf;
    }

    # Videos: iOS/Safari requires HTTP 206 byte-range.
    # s-maxage=0 keeps Cloudflare from caching full-object responses that break Range.
    location ~* \.(mp4|webm|mov)$ {
        gzip off;
        gunzip off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, s-maxage=0, no-transform" always;
        add_header Accept-Ranges bytes always;
        types {
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
        }
        default_type video/mp4;
    }

    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
